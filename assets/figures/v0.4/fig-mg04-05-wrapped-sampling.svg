    <text x="965" y="561" fill="#D6DCE3" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="400">t = 1 s</text>
    <text x="605" y="607" fill="#D6DCE3" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Both endpoints at t = 1 reduce to π/2 radians modulo 2π.</text>
    <text x="605" y="647" fill="#94A0AA" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="400">The shortest step needs a justified strict bound below π.</text>
